[project]
name = "chart-builder"
version = "0.1.0"
description = "Interactive multi-axis time-series chart generator"
readme = "README.md"
authors = [
    { name = "Kirill Gordievich", email = "kirill.gordievich777@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "plotly>=7.0.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]

[project.scripts]
chart-builder = "chart_builder.__main__:main"

[build-system]
requires = ["uv_build>=0.8.16,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true
